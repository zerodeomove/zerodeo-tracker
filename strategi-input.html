<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zerodeo — Input Strategi</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="wrap narrow">
  <div class="nav"><a href="index.html">Tracker</a><a href="marketing.html">Marketing</a></div>
  <h1>Strategi baru</h1>
  <div class="sub" style="margin-bottom:16px">Lane = produk yang diangkat. Channel = tempat programnya jalan. Boleh pilih lebih dari satu.</div>

  <div class="card">
  <form class="f" id="form">
    <label class="l">Nama strategi
      <input type="text" id="nama" placeholder="Contoh: Hook launch November">
      <span class="err" id="e-nama">Wajib diisi.</span></label>

    <label class="l">Pesan inti
      <textarea id="pesan" placeholder="Satu-dua kalimat: apa yang mau orang tangkap?"></textarea>
      <span class="err" id="e-pesan">Wajib diisi.</span></label>

    <div class="l">Lane
      <div class="chips" id="laneChips"></div>
      <div class="addrow"><input type="text" id="laneNew" placeholder="Tambah lane baru…"><button type="button" class="btn ghost" data-add="lane">Tambah</button></div>
      <span class="err" id="e-lane">Pilih minimal satu lane.</span></div>

    <div class="l">Channel
      <div class="chips" id="channelChips"></div>
      <div class="addrow"><input type="text" id="channelNew" placeholder="Tambah channel baru…"><button type="button" class="btn ghost" data-add="channel">Tambah</button></div>
      <span class="err" id="e-channel">Pilih minimal satu channel.</span></div>

    <div class="row2">
      <label class="l">Mulai<input type="date" id="mulai"><span class="err" id="e-mulai">Wajib diisi.</span></label>
      <label class="l">Selesai (opsional)<input type="date" id="selesai"><span class="err" id="e-selesai">Tidak boleh sebelum tanggal mulai.</span></label>
    </div>

    <div class="row2">
      <label class="l">PIC
        <select id="pic"><option value="">Pilih…</option><option>Lenno</option><option>Ricko</option><option>Yanuar</option><option>Christina</option></select>
        <span class="err" id="e-pic">Wajib dipilih.</span></label>
      <label class="l">Status
        <select id="status"><option>Ide</option><option>Jalan</option><option>Selesai</option></select></label>
    </div>

    <button type="submit" class="btn" id="submit" style="padding:13px;font-size:15px">Simpan strategi</button>
  </form>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script src="common.js"></script>
<script>
const esc = window.zEsc;
const $ = (id) => document.getElementById(id);
const opts = { lane: [], channel: [] };
const sel = { lane: new Set(), channel: new Set() };

function clean(s) { return String(s || '').replace(/,/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60); }
function today() { return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); }

function renderChips(kind) {
  $(kind + 'Chips').innerHTML = opts[kind].map((o, i) =>
    `<label class="chip ${sel[kind].has(o) ? 'on' : ''}"><input type="checkbox" data-kind="${kind}" data-i="${i}" ${sel[kind].has(o) ? 'checked' : ''}>${esc(o)}</label>`
  ).join('') || '<span class="sub">Belum ada pilihan, tambah di bawah.</span>';
}

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches && t.matches('input[data-kind]')) {
    const k = t.dataset.kind, o = opts[k][+t.dataset.i];
    if (t.checked) sel[k].add(o); else sel[k].delete(o);
    renderChips(k);
  }
});

function addNew(kind) {
  const inp = $(kind + 'New'), c = clean(inp.value);
  if (!c) return;
  const ex = opts[kind].find((o) => o.toLowerCase() === c.toLowerCase());
  const use = ex || c;
  if (!ex) opts[kind].push(c);
  sel[kind].add(use);
  inp.value = '';
  renderChips(kind);
}
document.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => addNew(b.dataset.add)));
['lane', 'channel'].forEach((k) => $(k + 'New').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); addNew(k); }
}));

function showMsg(t, ok) { $('msg').textContent = t; $('msg').className = 'msg ' + (ok ? 'ok' : 'bad'); }

async function init() {
  $('mulai').value = today();
  try {
    const j = await zApi.get();
    if (j.ok === false) throw new Error(j.error || 'Gagal');
    opts.lane = (j.lane || []).slice();
    opts.channel = (j.channel || []).slice();
  } catch (e) { showMsg('Gagal ambil daftar lane/channel: ' + e.message, false); }
  renderChips('lane'); renderChips('channel');
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('msg').className = 'msg';
  document.querySelectorAll('.err').forEach((x) => x.classList.remove('show'));
  const v = {
    nama: $('nama').value.trim(), pesan: $('pesan').value.trim(),
    mulai: $('mulai').value, selesai: $('selesai').value, pic: $('pic').value, status: $('status').value
  };
  let ok = true;
  const bad = (id) => { $(id).classList.add('show'); ok = false; };
  if (!v.nama) bad('e-nama');
  if (!v.pesan) bad('e-pesan');
  if (!sel.lane.size) bad('e-lane');
  if (!sel.channel.size) bad('e-channel');
  if (!v.mulai) bad('e-mulai');
  if (v.selesai && v.mulai && v.selesai < v.mulai) bad('e-selesai');
  if (!v.pic) bad('e-pic');
  if (!ok) return;

  $('submit').disabled = true; $('submit').textContent = 'Menyimpan…';
  try {
    const j = await zApi.post({
      action: 'add_strategi', nama: v.nama, pesan: v.pesan,
      lane: Array.from(sel.lane), channel: Array.from(sel.channel),
      mulai: v.mulai, selesai: v.selesai || null, pic: v.pic, status: v.status
    });
    if (!j.ok) throw new Error(j.error || 'Gagal');
    showMsg('Tersimpan. Lane/channel baru otomatis masuk daftar untuk semua orang.', true);
    $('form').reset(); sel.lane.clear(); sel.channel.clear();
    $('mulai').value = today();
    renderChips('lane'); renderChips('channel');
  } catch (err) { showMsg('Gagal simpan: ' + err.message, false); }
  finally { $('submit').disabled = false; $('submit').textContent = 'Simpan strategi'; }
});

init();
</script>
</body>
</html>
