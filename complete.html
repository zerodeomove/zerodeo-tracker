<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zerodeo — Lengkapi Kegiatan</title>
<style>
  :root {
    --bg: #F5F4EF;
    --surface: #FFFFFF;
    --border: #DEDCD3;
    --text: #1F2422;
    --text-muted: #6B6F68;
    --accent: #4A87A8;
    --accent-dark: #2D5A72;
    --green: #2F6B3A;
    --green-bg: #E6F0E6;
    --red: #A13A2E;
    --red-bg: #F7E7E4;
    --amber: #B8860B;
    --amber-bg: #FBF2DD;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 18px 60px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 4px 0; }
  .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

  .info, form {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; margin-bottom: 14px;
  }
  .info-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--bg); font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .k { color: var(--text-muted); flex-shrink: 0; }
  .info-row .v { font-weight: 600; text-align: right; word-break: break-word; }

  form { display: flex; flex-direction: column; gap: 14px; }
  label {
    font-size: 13px; font-weight: 500; color: var(--text); display: flex; flex-direction: column; gap: 6px;
  }
  input {
    font-size: 16px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); color: var(--text); font-family: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 12px; color: var(--text-muted); font-weight: 400; }

  .preview { display: none; margin-top: 4px; }
  .preview img { max-width: 100%; max-height: 260px; border-radius: 8px; border: 1px solid var(--border); display: block; }
  .preview .size { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  button[type=submit] {
    background: var(--accent); color: #fff; border: none; padding: 13px;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  button[type=submit]:active { background: var(--accent-dark); }
  button[type=submit]:disabled { opacity: 0.6; }

  .msg {
    margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 13px; display: none;
  }
  .msg.ok { background: var(--green-bg); color: var(--green); display: block; }
  .msg.err { background: var(--red-bg); color: var(--red); display: block; }
  .msg.warn { background: var(--amber-bg); color: var(--amber); display: block; }

  .field-error { font-size: 12px; color: var(--red); display: none; }
  .field-error.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Lengkapi kegiatan</h1>
  <div class="sub">Zerodeo. <a href="index.html" style="color:var(--accent)">← Balik ke tracker</a></div>

  <div class="msg" id="statusMsg"></div>

  <div class="info" id="infoBox" style="display:none">
    <div class="info-row"><span class="k">Item Kegiatan</span><span class="v" id="i-item"></span></div>
    <div class="info-row"><span class="k">Kategori</span><span class="v" id="i-kategori"></span></div>
    <div class="info-row"><span class="k">Estimasi</span><span class="v" id="i-estimasi"></span></div>
    <div class="info-row"><span class="k">Nominal Transfer</span><span class="v" id="i-transfer"></span></div>
  </div>

  <form id="completeForm" style="display:none">
    <label>
      Actual (Rp)
      <input type="number" id="actual" placeholder="0" min="0" step="1" inputmode="numeric">
      <span class="field-error" id="err-actual">Isi angka lebih dari 0.</span>
    </label>

    <label>
      Foto nota
      <input type="file" id="photo" accept="image/*" capture="environment">
      <span class="hint">Opsional. Foto dikecilkan otomatis sebelum dikirim.</span>
      <div class="preview" id="preview">
        <img id="previewImg" alt="Preview nota">
        <div class="size" id="previewSize"></div>
      </div>
    </label>

    <button type="submit" id="submitBtn">Simpan &amp; tandai selesai</button>
  </form>

  <div class="msg" id="msgBox"></div>
</div>

<script src="common.js"></script>
<script>
const MAX_DIM = 1600;
const JPEG_QUALITY = 0.7;

const rowNum = parseInt(new URLSearchParams(location.search).get('row'), 10);

const statusMsg = document.getElementById('statusMsg');
const infoBox = document.getElementById('infoBox');
const form = document.getElementById('completeForm');
const submitBtn = document.getElementById('submitBtn');
const msgBox = document.getElementById('msgBox');
const photoInput = document.getElementById('photo');

let photoBase64 = null; // hasil kompresi, tanpa prefix data:...;base64,

function fmtRupiah(n) {
  const num = Number(n);
  if (n === null || n === undefined || n === '' || isNaN(num) || num === 0) return '-';
  return (num < 0 ? '-Rp' : 'Rp') + Math.abs(Math.round(num)).toLocaleString('id-ID');
}

function showStatus(text, kind) {
  statusMsg.textContent = text;
  statusMsg.className = 'msg ' + kind;
}

function showMsg(text, ok) {
  msgBox.textContent = text;
  msgBox.className = 'msg ' + (ok ? 'ok' : 'err');
}

async function init() {
  if (!rowNum) {
    showStatus('Link tidak valid: nomor baris tidak ada. Buka lewat tombol "Lengkapi" di tracker.', 'err');
    return;
  }
  showStatus('Memuat data kegiatan…', 'warn');
  try {
    const json = await zApi.get();
    if (json.ok === false) throw new Error(json.error || 'Gagal');
    const item = (json.kegiatan || []).find(r => r['_row'] === rowNum);

    if (!item) {
      showStatus('Kegiatan di baris ' + rowNum + ' tidak ditemukan, jadi belum bisa dilengkapi.', 'err');
      return;
    }

    document.getElementById('i-item').textContent = item['Item Kegiatan'] || '-';
    document.getElementById('i-kategori').textContent = item['Kategori'] || '-';
    document.getElementById('i-estimasi').textContent = fmtRupiah(item['Estimasi (Rp)']);
    document.getElementById('i-transfer').textContent = fmtRupiah(item['Nominal Transfer (Rp)']);
    infoBox.style.display = 'block';

    if (item['Status'] === 'Selesai') {
      showStatus('Kegiatan ini sudah dilengkapi sebelumnya.', 'ok');
    } else if (item['Status'] !== 'Ditransfer') {
      showStatus('Belum bisa dilengkapi: statusnya masih "' + (item['Status'] || 'Draft') + '". Baru bisa setelah statusnya "Ditransfer".', 'warn');
    } else {
      statusMsg.className = 'msg';
      form.style.display = 'flex';
    }
  } catch (err) {
    showStatus('Gagal ambil data: ' + err.message, 'err');
  }
}

// Kecilkan foto: max sisi 1600px, JPEG kualitas 0.7. Return { base64, dataUrl, kb }.
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Gagal membaca file foto.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('File bukan gambar yang bisa dibaca.'));
      img.onload = () => {
        const scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
        const base64 = dataUrl.split(',')[1];
        resolve({ base64, dataUrl, kb: Math.round(base64.length * 3 / 4 / 1024) });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

photoInput.addEventListener('change', async () => {
  const file = photoInput.files[0];
  const preview = document.getElementById('preview');
  photoBase64 = null;
  preview.style.display = 'none';
  if (!file) return;
  try {
    const out = await compressImage(file);
    photoBase64 = out.base64;
    document.getElementById('previewImg').src = out.dataUrl;
    document.getElementById('previewSize').textContent = 'Ukuran setelah dikecilkan: ± ' + out.kb + ' KB';
    preview.style.display = 'block';
  } catch (err) {
    photoInput.value = '';
    showMsg(err.message, false);
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msgBox.className = 'msg';
  document.getElementById('err-actual').classList.remove('show');

  const actual = document.getElementById('actual').value;
  if (!actual || Number(actual) <= 0) {
    document.getElementById('err-actual').classList.add('show');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Menyimpan…';

  try {
    const json = await zApi.post({
      action: 'complete_kegiatan',
      row: rowNum,
      actual: Number(actual),
      photoBase64: photoBase64,
      photoMime: 'image/jpeg',
    });
    if (json.ok) {
      form.style.display = 'none';
      showMsg('Tersimpan. Kegiatan ditandai Selesai.', true);
    } else {
      showMsg('Gagal simpan: ' + (json.error || 'error tidak diketahui.'), false);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Simpan & tandai selesai';
    }
  } catch (err) {
    showMsg('Gagal kirim: ' + err.message, false);
    submitBtn.disabled = false;
    submitBtn.textContent = 'Simpan & tandai selesai';
  }
});

init();
</script>
</body>
</html>
